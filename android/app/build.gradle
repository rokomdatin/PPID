plugins {
    id 'com.android.application'
}

android {
    namespace 'id.go.pemberdayaan.ppid'
    compileSdk 35

    defaultConfig {
        applicationId 'id.go.pemberdayaan.ppid'
        minSdk 29
        targetSdk 35
        versionCode 4
        versionName '0.1.3-internal'
    }

    buildTypes {
        debug {
            // Debug APK: only for internal testing and KIP supporting evidence.
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
